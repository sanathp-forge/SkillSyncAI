<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Deep Obsidian Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0F10"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    
    <!-- 3D Electric Yellow Ribbon Gradient -->
    <linearGradient id="ribbonMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FF5E"/>
      <stop offset="45%" stop-color="#DFFF00"/>
      <stop offset="100%" stop-color="#E5A800"/>
    </linearGradient>

    <!-- Yellow Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" stroke="rgba(255,255,255,0.09)" stroke-width="1"/>

  <!-- Orbital Ring -->
  <ellipse cx="32" cy="32" rx="23" ry="10" transform="rotate(-28 32 32)" stroke="#DFFF00" stroke-width="1.2" stroke-opacity="0.65" stroke-dasharray="3 1.5"/>
  
  <!-- Orbital Constellation Nodes -->
  <circle cx="12" cy="40" r="2.5" fill="#DFFF00" filter="url(#glow)"/>
  <circle cx="52" cy="24" r="2.5" fill="#DFFF00" filter="url(#glow)"/>

  <!-- Ribbon S Symbol -->
  <path d="M 33 13 C 39 12, 46 15, 47 19.5 C 47.5 21, 45 22, 41 21 C 35 20, 26 24, 25 29 C 24 31, 26 31.5, 30 30.5 C 36 29.5, 44 32, 45 37.5 C 46 43, 38 50, 29 51 C 23 52, 17 48, 16 43 C 15 41, 18 41, 21 42 C 27 44, 37 41, 38 35 C 39 31, 33 28, 27 27 C 20 26, 17 21, 19 16 C 22 12, 28 13, 33 13 Z" fill="url(#ribbonMid)" filter="url(#glow)"/>
  <!-- Highlight Crest -->
  <path d="M 33 14 C 38 13.5, 44 16, 45 19 C 43 20, 34 22, 27 27.5 C 30 28, 38 30, 42 34 C 44 38, 41 46, 31 49 C 25 50.5, 19 47, 18 43.5 C 22 43, 33 43, 36 37 C 37 33, 33 30, 28 29 C 22 27, 18 21.5, 20 17 C 23 13.5, 29 13.5, 33 14 Z" fill="#F4FF5E" opacity="0.45"/>
</svg>