services:
  # PostgreSQL with pgvector for semantic embeddings
  db:
    image: pgvector/pgvector:pg16
    container_name: skillsync-db
    restart: always
    environment:
      POSTGRES_USER: skillsync
      POSTGRES_PASSWORD: skillsync_dev
      POSTGRES_DB: skillsync_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillsync -d skillsync_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # FastAPI Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillsync-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://skillsync:skillsync_dev@db:5432/skillsync_db
      - SECRET_KEY=development-secret-key-skillsync-ai
      - DEMO_MODE=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  # Frontend Vite Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skillsync-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
      - VITE_DEMO_MODE=true
    depends_on:
      - backend

volumes:
  pgdata:
